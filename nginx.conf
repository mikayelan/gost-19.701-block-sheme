server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # SPA fallback — все маршруты на index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-GOST "19.701-90 Senior 33y" always;
    }

    # Статика — агрессивно кешируем (Vite хеширует файлы)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Health
    location /health {
        access_log off;
        return 200 "OK GOST 19.701-90\n";
        add_header Content-Type text/plain;
    }

    # Безопасность — прячем сервер
    server_tokens off;
}
